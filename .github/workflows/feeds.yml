name: Update F-Droid and Pages
# Every 30 minutes: if collieim-android has a newer full release than repo.collie.im serves,
# rebuild the whole Pages site (F-Droid repo with the newest full releases, landing page,
# unchanged native inputs) and deploy it. Prereleases are never published here.
# Enable with the repository variable FEEDS_ENABLED=true.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and deploy even if the newest release is already served
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: collie-pages-production
  cancel-in-progress: false
env:
  APP_REPO: 0cwa/collieim-android
  KEEP_RELEASES: ${{ vars.FEEDS_KEEP_RELEASES || '3' }}
jobs:
  check:
    if: vars.FEEDS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          latest=$(gh api "repos/$APP_REPO/releases/latest" -q .tag_name)
          served=$(curl -fsS https://repo.collie.im/feed-state.json 2>/dev/null | jq -r .latest || echo none)
          echo "Newest full release: $latest. Served: $served."
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$served" ] || [ "$FORCE" = true ]; then echo deploy=true >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://repo.collie.im/
    env:
      GH_TOKEN: ${{ github.token }}
      LATEST: ${{ needs.check.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r distribution/requirements.txt
      - name: Download the newest full releases
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          gh api "repos/$APP_REPO/releases?per_page=30" \
            -q '[.[] | select(.draft == false and .prerelease == false)] | .[:'"$KEEP_RELEASES"'] | .[].tag_name' \
          | while read -r tag; do
              gh release download "$tag" -R "$APP_REPO" --pattern collie.apk --output "$RUNNER_TEMP/apks/$tag.apk"
            done
          ls -la "$RUNNER_TEMP/apks"
      - name: Fetch native inputs from the live site
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$APP_REPO/main/build-inputs/native-artifacts.json" -o "$RUNNER_TEMP/native-artifacts.json"
          jq -r '.files[].path' "$RUNNER_TEMP/native-artifacts.json" | while read -r path; do
            mkdir -p "$RUNNER_TEMP/native/$(dirname "$path")"
            curl -fsSL "https://repo.collie.im/native-inputs/v1/maven/$path" -o "$RUNNER_TEMP/native/$path"
          done
      - name: Build the site
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          umask 077
          base64 -d <<<"$FDROID_KEYSTORE_B64" > "$RUNNER_TEMP/repo.p12"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python distribution/feed.py --site "$RUNNER_TEMP/site" --apks "$RUNNER_TEMP/apks" \
            --native "$RUNNER_TEMP/native" --native-plan "$RUNNER_TEMP/native-artifacts.json" \
            --latest "$LATEST" --keystore "$RUNNER_TEMP/repo.p12" --build-tools "$bt"
          rm -f "$RUNNER_TEMP/repo.p12"
          rm -rf "$RUNNER_TEMP/fdroid-work"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Read back the deployed site
        run: |
          for _ in $(seq 20); do
            served=$(curl -fsS -H 'Cache-Control: no-cache' "https://repo.collie.im/feed-state.json?$(date +%s)" | jq -r .latest || true)
            [ "$served" = "$LATEST" ] && break
            sleep 30
          done
          [ "$served" = "$LATEST" ] || { echo "::error::repo.collie.im still serves $served"; exit 1; }
          curl -fsSI https://repo.collie.im/fdroid/repo/index-v1.jar >/dev/null
          jq -r '.files[] | .path + " " + .sha256' "$RUNNER_TEMP/native-artifacts.json" | head -2 | while read -r path sum; do
            echo "$sum  -" > "$RUNNER_TEMP/expect"
            curl -fsSL "https://repo.collie.im/native-inputs/v1/maven/$path?$(date +%s)" | sha256sum -c "$RUNNER_TEMP/expect"
          done
