name: Update F-Droid and Pages
# Every 30 minutes: if collieim-android has a newer full release than repo.collie.im serves,
# rebuild the whole Pages site (F-Droid repo with the newest full releases, landing page,
# unchanged native inputs) and deploy it. Stable prereleases are never published here.
# With BETA_FEED_ENABLED=true it also does this for the newest TrailBlazer Beta prerelease
# (fdroid/beta/repo/), after the beta job proves the APK is its CI build plus signature.
# Enable with the repository variable FEEDS_ENABLED=true.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and deploy even if the newest release is already served
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: collie-pages-production
  cancel-in-progress: false
env:
  APP_REPO: 0cwa/collieim-android
  KEEP_RELEASES: ${{ vars.FEEDS_KEEP_RELEASES || '1' }}
jobs:
  check:
    if: vars.FEEDS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          latest=$(gh api "repos/$APP_REPO/releases/latest" -q .tag_name)
          served=$(curl -fsS https://repo.collie.im/feed-state.json 2>/dev/null | jq -r .latest || echo none)
          echo "Newest full release: $latest. Served: $served."
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$served" ] || [ "$FORCE" = true ]; then echo deploy=true >> "$GITHUB_OUTPUT"; fi

  # No secrets here. Selects the newest TrailBlazer prerelease and, if the feed does not serve it,
  # checks that its APK is the build-release.yml artifact of its signed tag commit plus its signature.
  beta:
    if: vars.FEEDS_ENABLED == 'true' && vars.BETA_FEED_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.verify.outputs.changed }}
      tag: ${{ steps.verify.outputs.tag }}
      sha256: ${{ steps.verify.outputs.sha256 }}
      source_commit: ${{ steps.verify.outputs.source_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - id: verify
        # `force` rebuilds the whole site (the check job) and keeps the served Beta route as it is.
        # Only a Beta tag that differs from the served one is new; re-publishing the served Beta
        # would fail the strict versionCode increase.
        run: |
          python distribution/beta_inputs.py select > "$RUNNER_TEMP/beta-select.json"
          cat "$RUNNER_TEMP/beta-select.json"
          if [ "$(jq -r .changed "$RUNNER_TEMP/beta-select.json")" != true ]; then echo changed=false >> "$GITHUB_OUTPUT"; exit 0; fi
          tag=$(jq -r .tag "$RUNNER_TEMP/beta-select.json")
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python distribution/beta_inputs.py verify --tag "$tag" --work "$RUNNER_TEMP/beta" --build-tools "$bt" \
            --output "$RUNNER_TEMP/beta-verified.json"
          sha=$(python distribution/apk_match.py --tools "$RUNNER_TEMP/apk-match-tools" \
            "$(jq -r .unsigned_apk "$RUNNER_TEMP/beta-verified.json")" "$(jq -r .published_apk "$RUNNER_TEMP/beta-verified.json")")
          test "$sha" = "$(jq -r .sha256 "$RUNNER_TEMP/beta-verified.json")"
          { echo changed=true; echo "tag=$tag"; echo "sha256=$sha"
            echo "source_commit=$(jq -r .source_commit "$RUNNER_TEMP/beta-verified.json")"; } >> "$GITHUB_OUTPUT"
      - if: steps.verify.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collie-beta-verified-input
          path: ${{ runner.temp }}/beta-verified.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: [check, beta]
    # A failed Beta check never holds back a Stable update; the run still shows the failure.
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      (needs.check.outputs.deploy == 'true' || (needs.beta.result == 'success' && needs.beta.outputs.changed == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://repo.collie.im/
    env:
      GH_TOKEN: ${{ github.token }}
      LATEST: ${{ needs.check.outputs.latest }}
      BETA_CHANGED: ${{ needs.beta.result == 'success' && needs.beta.outputs.changed == 'true' }}
      BETA_TAG: ${{ needs.beta.outputs.tag }}
      BETA_SHA256: ${{ needs.beta.outputs.sha256 }}
      BETA_SOURCE: ${{ needs.beta.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            distribution/requirements.txt
            distribution/build-requirements.txt
      - name: Install hash-pinned build backends, then runtime lock without isolation downloads
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r distribution/build-requirements.txt
          python -m pip install --require-hashes --no-build-isolation -r distribution/requirements.txt
      - name: Capture the verified whole-site baseline before building
        run: python distribution/feed.py capture-deploy-baseline "$RUNNER_TEMP/deploy-baseline.json" --retain-site "$RUNNER_TEMP/previous-site"
      - name: Stage the selected immutable release and optional regular history
        run: |
          python distribution/release_inputs.py releases --latest "$LATEST" --keep "$KEEP_RELEASES" \
            --apks "$RUNNER_TEMP/apks" --receipt "$RUNNER_TEMP/release-inputs.json"
      - name: Export immutable listing and native metadata through the Git data API
        run: |
          python distribution/release_inputs.py metadata --receipt "$RUNNER_TEMP/release-inputs.json" \
            --output "$RUNNER_TEMP/app-metadata" --evidence "$RUNNER_TEMP/metadata-inputs.json"
      - name: Fetch and verify the release's pinned native inputs
        run: |
          python distribution/release_inputs.py native --plan "$RUNNER_TEMP/app-metadata/build-inputs/native-artifacts.json" \
            --output "$RUNNER_TEMP/native"
      - name: Stage the verified Beta APK and its listing from the Beta tag
        if: env.BETA_CHANGED == 'true'
        run: |
          python distribution/beta_inputs.py stage --tag "$BETA_TAG" --sha256 "$BETA_SHA256" --source-commit "$BETA_SOURCE" \
            --apks "$RUNNER_TEMP/beta-apks" --receipt "$RUNNER_TEMP/beta-inputs.json"
          python distribution/beta_inputs.py metadata --receipt "$RUNNER_TEMP/beta-inputs.json" \
            --output "$RUNNER_TEMP/beta-metadata" --evidence "$RUNNER_TEMP/beta-metadata-inputs.json"
          echo "BETA_ARGS=--beta-apks $RUNNER_TEMP/beta-apks --beta-fastlane $RUNNER_TEMP/beta-metadata --beta-tag $BETA_TAG" >> "$GITHUB_ENV"
      - name: Retain the verified release input identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collie-feed-release-inputs
          path: |
            ${{ runner.temp }}/release-inputs.json
            ${{ runner.temp }}/metadata-inputs.json
            ${{ runner.temp }}/app-metadata/build-inputs/native-artifacts.json
            ${{ runner.temp }}/beta-inputs.json
            ${{ runner.temp }}/beta-metadata-inputs.json
          if-no-files-found: error
          retention-days: 90
      - name: Build the site
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          umask 077
          base64 -d <<<"$FDROID_KEYSTORE_B64" > "$RUNNER_TEMP/repo.p12"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python distribution/feed.py --site "$RUNNER_TEMP/site" --apks "$RUNNER_TEMP/apks" \
            --native "$RUNNER_TEMP/native" --native-plan "$RUNNER_TEMP/app-metadata/build-inputs/native-artifacts.json" \
            --latest "$LATEST" --fastlane "$RUNNER_TEMP/app-metadata/fastlane/metadata/android" --keystore "$RUNNER_TEMP/repo.p12" --build-tools "$bt" \
            ${BETA_ARGS:---preserve-beta} \
            --previous-site "$RUNNER_TEMP/previous-site" --previous-baseline "$RUNNER_TEMP/deploy-baseline.json"
          rm -f "$RUNNER_TEMP/repo.p12"
          rm -rf "$RUNNER_TEMP/fdroid-work" "$RUNNER_TEMP/fdroid-beta-work"
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      # This pinned action leaves the exact uploaded tar at RUNNER_TEMP/artifact.tar.
      # Include its real headers/padding in the ceiling before any Pages deployment.
      - name: Enforce the complete Pages archive budget
        run: python distribution/feed.py verify-uploaded-archive "$RUNNER_TEMP/artifact.tar"
      # The stock deploy-pages action gives up after 10 minutes and cancels the deployment; a site
      # with the native libraries and an APK needs longer, so poll the Pages API for up to 30.
      - name: Deploy and poll until success or the deadline
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python distribution/deploy_pages.py --artifact-id "$ARTIFACT_ID" --timeout-seconds 1800 --feed-baseline "$RUNNER_TEMP/deploy-baseline.json"
      - name: Read back the deployed site
        run: |
          for _ in $(seq 20); do
            served=$(curl -fsS -H 'Cache-Control: no-cache' "https://repo.collie.im/feed-state.json?$(date +%s)" | jq -r .latest || true)
            [ "$served" = "$LATEST" ] && break
            sleep 30
          done
          [ "$served" = "$LATEST" ] || { echo "::error::repo.collie.im still serves $served"; exit 1; }
          curl -fsSI https://repo.collie.im/fdroid/repo/index-v1.jar >/dev/null
          python distribution/feed.py --site "$RUNNER_TEMP/site" --verify-live-site
          jq -r '.files[] | .url + " " + .sha256' "$RUNNER_TEMP/app-metadata/build-inputs/native-artifacts.json" | head -2 | while read -r url sum; do
            echo "$sum  -" > "$RUNNER_TEMP/expect"
            curl -fsSL "$url?$(date +%s)" | sha256sum -c "$RUNNER_TEMP/expect"
          done
