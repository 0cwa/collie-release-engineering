name: Manually deploy approved Pages snapshots
on:
  workflow_dispatch:
    inputs:
      preparation_mode:
        description: Feed rollout, or first add-link activation after production acceptance
        type: choice
        options: [feed, activate-links]
        default: feed
        required: true
      trusted_policy_revision:
        description: Exact reviewed main commit containing this verifier/workflow
        type: string
        required: true
      bundle_asset_id:
        description: Explicit public engineering release-asset ID (approved data only)
        type: string
        required: true
      bundle_sha256:
        description: Independently approved SHA256 of the complete input bundle
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: collie-pages-production
  cancel-in-progress: false
jobs:
  prepare:
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      phase1_artifact_id: ${{ steps['phase1-upload'].outputs.artifact_id }}
      phase2_artifact_id: ${{ steps['phase2-upload'].outputs.artifact_id }}
    # Disabled until separately approved Pages/environment provisioning. PRs and
    # non-main dispatches have no path to these jobs; no pull_request_target.
    if: github.ref == 'refs/heads/main' && vars.COLLIE_PAGES_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the independently approved policy commit
        env:
          APPROVED_POLICY: ${{ inputs.trusted_policy_revision }}
          RUN_POLICY: ${{ github.sha }}
        run: test "$APPROVED_POLICY" = "$RUN_POLICY"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install pinned verification tools without signing/deployment credentials
        run: python -m pip install --require-hashes -r distribution/requirements.txt
      - name: Fetch only the approved data asset and unpack regular files
        env:
          ASSET_ID: ${{ inputs.bundle_asset_id }}
          EXPECTED_SHA256: ${{ inputs.bundle_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python distribution/download_pages_input.py --asset-id "$ASSET_ID" --sha256 "$EXPECTED_SHA256" --output "$RUNNER_TEMP/input.tar"
          python distribution/pages.py unpack "$RUNNER_TEMP/input.tar" "$RUNNER_TEMP/inputs"
      - name: Prepare the approved snapshots with the trusted policy
        id: prepare
        env:
          APPROVED_POLICY: ${{ inputs.trusted_policy_revision }}
          PREPARATION_MODE: ${{ inputs.preparation_mode }}
        run: |
          case "$PREPARATION_MODE" in feed|activate-links) ;; *) exit 1 ;; esac
          echo "mode=$PREPARATION_MODE" >> "$GITHUB_OUTPUT"
          if [ "$PREPARATION_MODE" = feed ]; then
            python distribution/pages.py prepare "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/pages" --policy "$APPROVED_POLICY"
          else
            python distribution/pages_activation.py prepare "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/pages" --policy "$APPROVED_POLICY"
          fi
          python distribution/pages.py preflight "$RUNNER_TEMP/pages/plan.json" "$RUNNER_TEMP/pages/journal.json"
          if [ "$PREPARATION_MODE" = activate-links ]; then
            python distribution/pages.py readback "$RUNNER_TEMP/pages/plan.json" "$RUNNER_TEMP/pages/journal.json" --phase phase1
          fi
          mkdir "$RUNNER_TEMP/control"
          cp "$RUNNER_TEMP/pages/plan.json" "$RUNNER_TEMP/pages/journal.json" "$RUNNER_TEMP/control/"
          if [ "$PREPARATION_MODE" = activate-links ]; then
            mkdir "$RUNNER_TEMP/control/activation"
            for name in approval.json feed-plan.json feed-journal.json repository-receipt.json client-acceptance.json; do
              cp "$RUNNER_TEMP/inputs/$name" "$RUNNER_TEMP/control/activation/"
            done
          fi
      # Official Pages wrapper constructs the artifact.tar expected by deploy-pages.
      # Include any approved hidden paths without changing the prepared inventory.
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        id: phase1-upload
        if: inputs.preparation_mode == 'feed'
        with:
          name: collie-pages-phase1
          path: ${{ runner.temp }}/pages/phase1/site
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        id: phase2-upload
        with:
          name: collie-pages-phase2
          path: ${{ runner.temp }}/pages/phase2/site
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collie-pages-control
          path: ${{ runner.temp }}/control/
          if-no-files-found: error
          retention-days: 90
  phase1:
    if: needs.prepare.outputs.mode == 'feed'
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Deploy phase 1 and poll until success or final deadline
        id: deploy
        env:
          ARTIFACT_ID: ${{ needs.prepare.outputs.phase1_artifact_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: exec python distribution/deploy_pages.py --artifact-id "$ARTIFACT_ID" --timeout-seconds 1800
  phase1-readback:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.phase1.result == 'success' || needs.prepare.outputs.mode == 'activate-links') }}
    needs: [prepare, phase1]
    outputs:
      phase2_artifact_id: ${{ needs.prepare.outputs.phase2_artifact_id }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collie-pages-control
          path: ${{ runner.temp }}/control/
      - if: inputs.preparation_mode == 'feed'
        run: python distribution/pages.py readback "$RUNNER_TEMP/control/plan.json" "$RUNNER_TEMP/control/journal.json" --phase phase1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collie-pages-after-phase1
          path: ${{ runner.temp }}/control/
          if-no-files-found: error
          retention-days: 90
  phase2:
    if: ${{ !cancelled() && needs['phase1-readback'].result == 'success' }}
    needs: phase1-readback
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Deploy phase 2 and poll until success or final deadline
        id: deploy
        env:
          ARTIFACT_ID: ${{ needs['phase1-readback'].outputs.phase2_artifact_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: exec python distribution/deploy_pages.py --artifact-id "$ARTIFACT_ID" --timeout-seconds 1800
  final-readback:
    if: ${{ !cancelled() && needs.phase2.result == 'success' }}
    needs: phase2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collie-pages-after-phase1
          path: ${{ runner.temp }}/control/
      - run: python distribution/pages.py readback "$RUNNER_TEMP/control/plan.json" "$RUNNER_TEMP/control/journal.json" --phase phase2
      - name: Preserve completed production link activation evidence
        if: inputs.preparation_mode == 'activate-links'
        run: python distribution/pages_activation.py record "$RUNNER_TEMP/control/activation" "$RUNNER_TEMP/control/plan.json" "$RUNNER_TEMP/control/journal.json" > "$RUNNER_TEMP/control/link-activation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collie-pages-completed-receipt
          path: ${{ runner.temp }}/control/
          if-no-files-found: error
          retention-days: 90
