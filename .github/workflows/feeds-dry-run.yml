name: F-Droid and Pages dry run
# Builds the full site with a throwaway key, an explicit preview marker, and no deploy.
# It also runs the complete Beta check when there is a new TrailBlazer prerelease.
on:
  pull_request:
    paths:
      - distribution/feed.py
      - distribution/binary_repo.py
      - distribution/site_page.py
      - distribution/release_inputs.py
      - distribution/native_generations.py
      - distribution/beta_inputs.py
      - distribution/channel_profile.py
      - distribution/apk_match.py
      - distribution/retained_artifacts.py
      - distribution/beta-metadata/**
      - distribution/metadata/**
      - distribution/config.public.yml
      - distribution/site/**
      - distribution/test_*.py
      - .github/workflows/feeds.yml
      - .github/workflows/feeds-dry-run.yml
  workflow_dispatch:
    inputs:
      force_beta_verify:
        description: Verify the newest Beta even if the feed already serves it
        type: boolean
        default: false
permissions:
  contents: read
env:
  APP_REPO: 0cwa/collieim-android
  KEEP_RELEASES: ${{ vars.FEEDS_KEEP_RELEASES || '1' }}
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install hash-pinned distribution tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r distribution/build-requirements.txt
          python -m pip install --require-hashes --no-build-isolation -r distribution/requirements.txt
      - name: Test distribution and Beta verification
        run: python -m unittest discover -s distribution -p 'test_*.py'
      - name: Capture the same verified site and retention inputs used for production
        run: python distribution/feed.py capture-deploy-baseline "$RUNNER_TEMP/deploy-baseline.json" --retain-site "$RUNNER_TEMP/previous-site"
      - name: Stage the exact latest regular release
        run: |
          latest=$(gh api "repos/$APP_REPO/releases/latest" -q .tag_name)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python distribution/release_inputs.py releases --latest "$latest" --keep "$KEEP_RELEASES" \
            --apks "$RUNNER_TEMP/apks" --receipt "$RUNNER_TEMP/release-inputs.json" --build-tools "$bt"
          echo "LATEST=$latest" >> "$GITHUB_ENV"
      - name: Export immutable listing and native metadata through the Git data API
        run: |
          python distribution/release_inputs.py metadata --receipt "$RUNNER_TEMP/release-inputs.json" \
            --output "$RUNNER_TEMP/app-metadata" --evidence "$RUNNER_TEMP/metadata-inputs.json"
      - name: Fetch and verify the release's pinned native inputs
        run: |
          python distribution/release_inputs.py native --plan "$RUNNER_TEMP/app-metadata/build-inputs/native-artifacts.json" \
            --output "$RUNNER_TEMP/native"
      - name: Check the Beta candidate exactly as the feed would, and export its listing
        env:
          FORCE_BETA_VERIFY: ${{ inputs.force_beta_verify || false }}
        run: |
          args=()
          if [[ "$FORCE_BETA_VERIFY" == true ]]; then args+=(--force); fi
          python distribution/beta_inputs.py select "${args[@]}" > "$RUNNER_TEMP/beta-select.json"
          cat "$RUNNER_TEMP/beta-select.json"
          if [[ "$(jq -r '.changed' "$RUNNER_TEMP/beta-select.json")" == false ]]; then
            echo 'No new Beta candidate. The production feed carries forward the signed Beta APK.'
            exit 0
          fi
          tag=$(jq -er '.tag | select(length > 0)' "$RUNNER_TEMP/beta-select.json")
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python distribution/beta_inputs.py verify --tag "$tag" --work "$RUNNER_TEMP/beta" --build-tools "$bt" \
            --output "$RUNNER_TEMP/beta-verified.json"
          sha=$(python distribution/apk_match.py --tools "$RUNNER_TEMP/apk-match-tools" \
            "$(jq -r .unsigned_apk "$RUNNER_TEMP/beta-verified.json")" "$(jq -r .published_apk "$RUNNER_TEMP/beta-verified.json")")
          test "$sha" = "$(jq -r .sha256 "$RUNNER_TEMP/beta-verified.json")"
          echo "Beta $tag: published APK $sha is its CI build plus signature"
          python distribution/beta_inputs.py metadata --receipt "$RUNNER_TEMP/beta-verified.json" \
            --output "$RUNNER_TEMP/beta-metadata" --evidence "$RUNNER_TEMP/beta-metadata-inputs.json"
          python distribution/beta_inputs.py native-plan --tag "$tag" --output "$RUNNER_TEMP/beta-native-plan.json"
          echo "BETA_TAG=$tag" >> "$GITHUB_ENV"
          echo "BETA_APKS=$(dirname "$(jq -r .published_apk "$RUNNER_TEMP/beta-verified.json")")" >> "$GITHUB_ENV"
      - name: Retain the verified release input identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collie-feed-release-inputs
          path: |
            ${{ runner.temp }}/release-inputs.json
            ${{ runner.temp }}/metadata-inputs.json
            ${{ runner.temp }}/app-metadata/build-inputs/native-artifacts.json
            ${{ runner.temp }}/beta-verified.json
            ${{ runner.temp }}/beta-metadata-inputs.json
          if-no-files-found: error
          retention-days: 90
      - name: Build the site with a throwaway key
        run: |
          beta_args=()
          beta_tag=${BETA_TAG:-}
          if [[ -n "$beta_tag" ]]; then
            beta_args=(--beta-apks "$BETA_APKS" --beta-fastlane "$RUNNER_TEMP/beta-metadata" --beta-tag "$beta_tag" --keep-native-plan "$RUNNER_TEMP/beta-native-plan.json")
          fi
          export FDROID_KEYSTORE_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/repo.p12" -storetype PKCS12 -alias collie-repo \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=dry run" \
            -storepass:env FDROID_KEYSTORE_PASS -keypass:env FDROID_KEYSTORE_PASS
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python distribution/feed.py --site "$RUNNER_TEMP/site" --apks "$RUNNER_TEMP/apks" \
            --native "$RUNNER_TEMP/native" --native-plan "$RUNNER_TEMP/app-metadata/build-inputs/native-artifacts.json" \
            --latest "$LATEST" --fastlane "$RUNNER_TEMP/app-metadata/fastlane/metadata/android" --keystore "$RUNNER_TEMP/repo.p12" --build-tools "$bt" --preview \
            --previous-site "$RUNNER_TEMP/previous-site" --previous-baseline "$RUNNER_TEMP/deploy-baseline.json" \
            "${beta_args[@]}" | tee "$RUNNER_TEMP/site-size.json"
          test ! -e "$RUNNER_TEMP/site/fdroid/beta"
          jq -e '(.packages | keys) == ["im.collie.app", "im.collie.app.trailblazer"]' \
            "$RUNNER_TEMP/site/fdroid/repo/index-v2.json"
          grep -q 'Collie TrailBlazer (Beta)' "$RUNNER_TEMP/site/index.html"
      - name: Measure the Pages archive using the production tar options
        # Match actions/upload-pages-artifact at fc324d3547104276b827a68afc52ff2a11cc49c9.
        run: |
          tar --dereference --hard-dereference --directory "$RUNNER_TEMP/site" \
            -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github --exclude='.[^/]*' .
          python distribution/feed.py verify-uploaded-archive "$RUNNER_TEMP/artifact.tar" | tee "$RUNNER_TEMP/archive-size.json"
      - name: Retain size and index evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collie-dry-run-evidence
          path: |
            ${{ runner.temp }}/site-size.json
            ${{ runner.temp }}/archive-size.json
            ${{ runner.temp }}/site/site-manifest.json
            ${{ runner.temp }}/site/fdroid/repo/entry.jar
            ${{ runner.temp }}/site/fdroid/repo/index-v1.jar
            ${{ runner.temp }}/site/fdroid/repo/index-v2.json
          if-no-files-found: error
