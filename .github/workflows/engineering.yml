name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch archived upstream provenance
        run: git fetch --no-tags --depth=1 origin refs/tags/archive/patch-forest:refs/tags/archive/patch-forest
      - run: python3 -m unittest discover -s tests -v
  native-tooling:
    name: Native tooling unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Test source preparation and native artifact verification
        run: |
          python3 - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tools/native", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun - len(result.skipped) == 0:
              sys.exit("No native-tooling tests executed.")
          sys.exit(not result.wasSuccessful())
          PY
