name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: PYTHONPATH=tools/patches python3 -m unittest tools/patches/test_migration_receipts.py tools/patches/test_release_artifacts.py
      - run: PYTHONPATH=tools/patches python3 -m unittest tools/patches/test_hosted_eligibility.py tools/patches/test_native_release_route.py -v
  native-tooling:
    name: Native tooling unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: tools/patches
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Test source preparation and native artifact verification
        run: |
          python3 - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tools/native", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun - len(result.skipped) == 0:
              sys.exit("No native-tooling tests executed.")
          sys.exit(not result.wasSuccessful())
          PY
