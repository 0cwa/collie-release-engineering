name: Pages preparation checks
on:
  pull_request:
    paths: ['distribution/**', '.github/workflows/pages*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install the exact pinned static-page dependencies
        run: python -m pip install --require-hashes -r distribution/site-requirements.txt
      - name: Test data-only preparation and failure handling
        run: python -m unittest discover -s distribution -p 'test_*.py'
      - name: Compile entrypoints
        run: python -m py_compile distribution/*.py
